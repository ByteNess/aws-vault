on:
  push:
    #branches-ignore:
    #  - main
    tags:
      - 'v*'
    #tag-ignore:
    #  - 'v*'
  workflow_dispatch: {}

env:
  GOTELEMETRY: off
  CGO_ENABLED: 1

permissions:
  contents: write

name: Build & Release
jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: aws-vault-linux-amd64
            cgo: "1"
            cc: gcc
            pkg: build-essential

          - goos: linux
            goarch: arm64
            out: aws-vault-linux-arm64
            cgo: "1"
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu

          - goos: linux
            goarch: ppc64le
            out: aws-vault-linux-ppc64le
            cgo: "1"
            cc: powerpc64le-linux-gnu-gcc
            pkg: gcc-powerpc64le-linux-gnu

          - goos: freebsd
            goarch: amd64
            out: aws-vault-freebsd-amd64
            cgo: "0"
            cc: ""
            pkg: ""

          - goos: windows
            goarch: amd64
            out: aws-vault-windows-amd64.exe
            cgo: "0"
            cc: ""
            pkg: ""

          - goos: windows
            goarch: arm64
            out: aws-vault-windows-arm64.exe
            cgo: "0"
            cc: ""
            pkg: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disable shallow clone - get all

      #- name: Unshallow
      #  run: git fetch --prune --unshallow

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          #go-version-file: 'go.mod'
          check-latest: true
        id: go

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.pkg }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: |
          make ${{ matrix.out }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

